<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>feeds page</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="template">
      <div class="one"><p>Network</p></div>
      <div class="two"><h1>Your Feed</h1></div>
      <div class="three">
        <img src="img/6720b6c5f2fd521751563548_profile.jpg" alt="avatar" /><a
          href=""
          >add an avater</a
        >
        <p>James Doe</p>
      </div>
      <div class="four">
        <div class="partOne">
          <p id="name">Neil M</p>
          <p><span id="num1" class="numberOfLikes">10</span>like(s)</p>
          <button id="btn0" onclick="like(this)" >Like</button>
        </div>
        <div class="partTwo">
          <p>
            I just set up this new discord bot,let me<br />know what you all
            thik. <a href="">link</a>
          </p>
        </div>
      </div>
      <div class="five">
        <div class="partOne">
          <p id="name">Nichole K</p>
          <p><span id="num2" class="numberOfLikes">50</span>like(s)</p>
          <button id="btn1" onclick="like(this)">Like</button>
        </div>
        <div class="partTwo">
          <p>Just finished my <a href="">next comic,</a>check it out</p>
        </div>
      </div>
      <div class="six">
        <div class="partOne">
          <p id="name">Jim R</p>
          <p><span id="num3" class="numberOfLikes">60</span>like(s)</p>
          <button id="btn2" onclick="like(this)">Like</button>
        </div>
        <div class="partTwo">
          <p>
            I cant stop listening to the <a href="">new album</a> <br />who else
            is liking it?
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
